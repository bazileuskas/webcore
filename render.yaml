# Render reads this when you create a Blueprint from the repository.
services:
  - type: web
    name: tungtung-webcore-x7q
    runtime: node
    region: frankfurt # closest Render location to Spain
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TAVILY_API_KEY
        sync: false # set in Render's dashboard, never stored in the code
      - key: ANTHROPIC_API_KEY
        sync: false # for the AI section; set in Render's dashboard
